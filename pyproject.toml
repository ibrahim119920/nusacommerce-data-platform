[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nusacommerce-data-platform"
version = "0.14.0"
description = "NusaCommerce reference capstone through course Day 14"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32,<3",
    "SQLAlchemy>=2.0,<3",
    "pandas>=2.2,<4",
    "psycopg[binary]>=3.2,<4",
    "pyarrow>=18,<19",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F"]
